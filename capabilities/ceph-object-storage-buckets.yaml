naftiko: 1.0.0-alpha2
info:
  label: Rook Ceph Object Storage API — Buckets
  description: 'Rook Ceph Object Storage API — Buckets. 4 operations. Lead operation: List All Buckets. Self-contained Naftiko
    capability covering one Rook business surface.'
  tags:
  - Rook
  - Buckets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ROOK_API_KEY: ROOK_API_KEY
capability:
  consumes:
  - type: http
    namespace: ceph-object-storage-buckets
    baseUri: http://{rgw-host}:{port}
    description: Rook Ceph Object Storage API — Buckets business capability. Self-contained, no shared references.
    resources:
    - name: root
      path: /
      operations:
      - name: listbuckets
        method: GET
        description: List All Buckets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: bucket
      path: /{bucket}
      operations:
      - name: createbucket
        method: PUT
        description: Create a Bucket
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: headbucket
        method: HEAD
        description: Check Bucket Existence and Access
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletebucket
        method: DELETE
        description: Delete a Bucket
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.ROOK_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: ceph-object-storage-buckets-rest
    port: 8080
    description: REST adapter for Rook Ceph Object Storage API — Buckets. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1
      name: root
      description: REST surface for root.
      operations:
      - method: GET
        name: listbuckets
        description: List All Buckets
        call: ceph-object-storage-buckets.listbuckets
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/{bucket}
      name: bucket
      description: REST surface for bucket.
      operations:
      - method: PUT
        name: createbucket
        description: Create a Bucket
        call: ceph-object-storage-buckets.createbucket
        outputParameters:
        - type: object
          mapping: $.
      - method: HEAD
        name: headbucket
        description: Check Bucket Existence and Access
        call: ceph-object-storage-buckets.headbucket
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletebucket
        description: Delete a Bucket
        call: ceph-object-storage-buckets.deletebucket
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ceph-object-storage-buckets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Rook Ceph Object Storage API — Buckets. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-all-buckets
      description: List All Buckets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ceph-object-storage-buckets.listbuckets
      outputParameters:
      - type: object
        mapping: $.
    - name: create-bucket
      description: Create a Bucket
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: ceph-object-storage-buckets.createbucket
      outputParameters:
      - type: object
        mapping: $.
    - name: check-bucket-existence-and-access
      description: Check Bucket Existence and Access
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ceph-object-storage-buckets.headbucket
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-bucket
      description: Delete a Bucket
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: ceph-object-storage-buckets.deletebucket
      outputParameters:
      - type: object
        mapping: $.
