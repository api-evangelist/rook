naftiko: "1.0.0-alpha1"

info:
  label: "Rook Ceph Object Storage"
  description: >-
    S3-compatible object storage API exposed by the Ceph RADOS Gateway (RGW)
    provisioned by Rook on Kubernetes. Supports bucket management, object CRUD,
    multipart uploads, and access control through AWS Signature V4 authentication.
  tags:
    - Ceph
    - Cloud Native
    - Kubernetes
    - Object Storage
    - S3
    - Storage
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      ROOK_S3_ACCESS_KEY: ROOK_S3_ACCESS_KEY
      ROOK_S3_SECRET_KEY: ROOK_S3_SECRET_KEY

capability:
  consumes:
    - type: http
      namespace: ceph-object-storage
      baseUri: http://rook-ceph-rgw-my-store.rook-ceph.svc
      description: "S3-compatible Ceph Object Storage gateway managed by Rook"
      authentication:
        type: apikey
        key: Authorization
        value: "{{ROOK_S3_ACCESS_KEY}}"
        placement: header
      resources:
        - name: buckets
          path: /
          description: "S3 bucket management operations"
          operations:
            - name: list-buckets
              method: GET
              description: "List all buckets owned by the authenticated user"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-bucket
              method: PUT
              description: "Create a new S3 bucket"
              inputParameters:
                - name: bucket
                  in: path
                  type: string
                  required: true
                  description: "Name of the bucket to create"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-bucket
              method: DELETE
              description: "Delete an empty S3 bucket"
              inputParameters:
                - name: bucket
                  in: path
                  type: string
                  required: true
                  description: "Name of the bucket to delete"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: head-bucket
              method: HEAD
              description: "Check bucket existence and access permissions"
              inputParameters:
                - name: bucket
                  in: path
                  type: string
                  required: true
                  description: "Name of the bucket to check"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: objects
          path: /{bucket}
          description: "S3 object operations within a bucket"
          operations:
            - name: list-objects
              method: GET
              description: "List objects in a bucket with optional prefix and pagination"
              inputParameters:
                - name: bucket
                  in: path
                  type: string
                  required: true
                  description: "Bucket name"
                - name: prefix
                  in: query
                  type: string
                  required: false
                  description: "Filter objects by key prefix"
                - name: max-keys
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of keys to return"
                - name: list-type
                  in: query
                  type: integer
                  required: false
                  description: "Use 2 for List Objects V2"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: put-object
              method: PUT
              description: "Upload an object to a bucket"
              inputParameters:
                - name: bucket
                  in: path
                  type: string
                  required: true
                  description: "Bucket name"
                - name: key
                  in: path
                  type: string
                  required: true
                  description: "Object key"
              body:
                type: binary
                data:
                  content: "{{tools.object_data}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-object
              method: GET
              description: "Download an object from a bucket"
              inputParameters:
                - name: bucket
                  in: path
                  type: string
                  required: true
                  description: "Bucket name"
                - name: key
                  in: path
                  type: string
                  required: true
                  description: "Object key"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-object
              method: DELETE
              description: "Delete an object from a bucket"
              inputParameters:
                - name: bucket
                  in: path
                  type: string
                  required: true
                  description: "Bucket name"
                - name: key
                  in: path
                  type: string
                  required: true
                  description: "Object key"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: head-object
              method: HEAD
              description: "Retrieve object metadata without downloading content"
              inputParameters:
                - name: bucket
                  in: path
                  type: string
                  required: true
                  description: "Bucket name"
                - name: key
                  in: path
                  type: string
                  required: true
                  description: "Object key"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: ceph-object-storage-api
      resources:
        - path: /v1/buckets
          name: buckets
          description: "S3 bucket management"
          operations:
            - method: GET
              name: list-buckets
              description: "List all buckets"
              call: "ceph-object-storage.list-buckets"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-bucket
              description: "Create a new bucket"
              call: "ceph-object-storage.create-bucket"
              with:
                bucket: "rest.bucket"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/buckets/{bucket}/objects
          name: objects
          description: "Object operations"
          operations:
            - method: GET
              name: list-objects
              description: "List objects in a bucket"
              call: "ceph-object-storage.list-objects"
              with:
                bucket: "rest.bucket"
                prefix: "rest.prefix"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: ceph-object-storage-mcp
      transport: http
      tools:
        - name: list-buckets
          description: "List all S3 buckets in the Ceph Object Storage gateway"
          hints:
            readOnly: true
            openWorld: false
          call: "ceph-object-storage.list-buckets"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-objects
          description: "List objects in a Ceph bucket with optional prefix filter"
          hints:
            readOnly: true
            openWorld: false
          call: "ceph-object-storage.list-objects"
          with:
            bucket: "tools.bucket"
            prefix: "tools.prefix"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-object
          description: "Download an object from Ceph object storage"
          hints:
            readOnly: true
            openWorld: false
          call: "ceph-object-storage.get-object"
          with:
            bucket: "tools.bucket"
            key: "tools.key"
          outputParameters:
            - type: object
              mapping: "$."
        - name: put-object
          description: "Upload an object to Ceph object storage"
          hints:
            readOnly: false
            openWorld: false
          call: "ceph-object-storage.put-object"
          with:
            bucket: "tools.bucket"
            key: "tools.key"
            object_data: "tools.object_data"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-object
          description: "Delete an object from Ceph object storage"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "ceph-object-storage.delete-object"
          with:
            bucket: "tools.bucket"
            key: "tools.key"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-bucket
          description: "Delete an empty Ceph bucket"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "ceph-object-storage.delete-bucket"
          with:
            bucket: "tools.bucket"
          outputParameters:
            - type: object
              mapping: "$."
