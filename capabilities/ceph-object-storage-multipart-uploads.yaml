naftiko: 1.0.0-alpha2
info:
  label: Rook Ceph Object Storage API — Multipart Uploads
  description: 'Rook Ceph Object Storage API — Multipart Uploads. 2 operations. Lead operation: Initiate a Multipart Upload.
    Self-contained Naftiko capability covering one Rook business surface.'
  tags:
  - Rook
  - Multipart Uploads
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ROOK_API_KEY: ROOK_API_KEY
capability:
  consumes:
  - type: http
    namespace: ceph-object-storage-multipart-uploads
    baseUri: http://{rgw-host}:{port}
    description: Rook Ceph Object Storage API — Multipart Uploads business capability. Self-contained, no shared references.
    resources:
    - name: bucket-key}?uploads
      path: /{bucket}/{key}?uploads
      operations:
      - name: createmultipartupload
        method: POST
        description: Initiate a Multipart Upload
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: uploads
          in: query
          type: string
          required: true
    - name: bucket}?uploads
      path: /{bucket}?uploads
      operations:
      - name: listmultipartuploads
        method: GET
        description: List In-Progress Multipart Uploads
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: uploads
          in: query
          type: string
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.ROOK_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: ceph-object-storage-multipart-uploads-rest
    port: 8080
    description: REST adapter for Rook Ceph Object Storage API — Multipart Uploads. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/{bucket}/key-uploads
      name: bucket-key-uploads
      description: REST surface for bucket-key}?uploads.
      operations:
      - method: POST
        name: createmultipartupload
        description: Initiate a Multipart Upload
        call: ceph-object-storage-multipart-uploads.createmultipartupload
        with:
          uploads: rest.uploads
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/bucket-uploads
      name: bucket-uploads
      description: REST surface for bucket}?uploads.
      operations:
      - method: GET
        name: listmultipartuploads
        description: List In-Progress Multipart Uploads
        call: ceph-object-storage-multipart-uploads.listmultipartuploads
        with:
          uploads: rest.uploads
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ceph-object-storage-multipart-uploads-mcp
    port: 9090
    transport: http
    description: MCP adapter for Rook Ceph Object Storage API — Multipart Uploads. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: initiate-multipart-upload
      description: Initiate a Multipart Upload
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ceph-object-storage-multipart-uploads.createmultipartupload
      with:
        uploads: tools.uploads
      outputParameters:
      - type: object
        mapping: $.
    - name: list-progress-multipart-uploads
      description: List In-Progress Multipart Uploads
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ceph-object-storage-multipart-uploads.listmultipartuploads
      with:
        uploads: tools.uploads
      outputParameters:
      - type: object
        mapping: $.
