specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Rook
providerId: rook
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - CNCF
  - Ceph
  - Cloud Native
  - Kubernetes
  - Storage
  - Open Source
description: >-
  Rook is a CNCF graduated, Apache 2.0 open-source Kubernetes operator for Ceph storage. The
  software itself is free; there is no project-issued pricing surface and no project-issued
  API. Commercial support is offered through third parties (Clyso provides Ceph/Rook support;
  Red Hat ships OpenShift Data Foundation, which embeds Rook).
sources:
  - https://rook.io/
  - https://github.com/rook/rook
plans:
  - id: rook-open-source
    name: Open Source (Apache 2.0)
    type: freemium
    description: >-
      The Rook operator and CRDs are released under the Apache 2.0 license. Free to use,
      modify, and self-host. Community support via GitHub, Slack, and CNCF channels.
    entries:
      - label: Software License
        name: software_license
        type: flat
        metric: license
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Apache 2.0 License
      - name: CNCF Graduated Project
      - name: Community Support (GitHub, Slack)
      - name: Self-Hosted on Any Kubernetes
  - id: rook-commercial-support
    name: Commercial Support (Third Party)
    type: enterprise
    description: >-
      Commercial Ceph/Rook support and managed offerings are sold by third parties such as
      Clyso (specialist Ceph/Rook professional services and support) and Red Hat (OpenShift
      Data Foundation, which packages Rook + Ceph as a supported product). Pricing is
      negotiated directly with the chosen vendor.
    entries:
      - label: Vendor support contract
        name: vendor_support
        type: flat
        metric: varies
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact vendor
        userMultiplied: false
    elements:
      - name: Clyso Professional Services
      - name: Red Hat OpenShift Data Foundation
      - name: Vendor SLA
maintainers:
