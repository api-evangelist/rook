provider: Rook
providerId: rook
publisherName: Cloud Native Computing Foundation
serviceCategory: Cloud Native Storage Orchestration
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Rook
  - Ceph
  - Kubernetes
  - Open Source
  - FinOps
  - FOCUS
description: >-
  Rook is Apache 2.0 open-source software hosted by the CNCF; it does not issue invoices.
  The relevant FinOps surface is the underlying compute, storage, and network capacity the
  operator consumes on the host Kubernetes cluster, plus any optional commercial-support
  contract with a vendor such as Clyso or Red Hat (OpenShift Data Foundation).
sources:
  - https://rook.io/
  - https://github.com/rook/rook
billingModel:
  pricingCategory: Open Source
  billingFrequency: None
  billingCurrency: USD
  chargeCategories:
    - Adjustment
focusColumns:
  ServiceName: Rook
  ServiceCategory: Cloud Native Storage Orchestration
  ProviderName: Rook (CNCF)
  PublisherName: Cloud Native Computing Foundation
  BillingCurrency: USD
meters:
  - name: storage_capacity
    description: >-
      Provisioned Ceph storage capacity managed by Rook (block, file, object); cost is
      incurred on the host cloud / on-prem hardware, not by Rook.
    unit: GB-month
    aggregation: max
    dimensions:
      - storage_class
      - cluster
  - name: compute_resources
    description: >-
      CPU and memory consumed by Rook operator pods, OSDs, MONs, MGRs, and RGWs on the host
      Kubernetes cluster.
    unit: cpu-hour
    aggregation: sum
    dimensions:
      - component
      - node
  - name: vendor_support_contract
    description: >-
      Annual subscription with a third-party support vendor (Clyso, Red Hat ODF). Optional.
    unit: month
    aggregation: sum
    dimensions:
      - vendor
principles:
  - name: Visibility
    description: >-
      Track Rook-managed storage usage with Ceph dashboards, Prometheus exports from the
      Rook operator, and the host cloud/cluster cost surface; there is no Rook-issued usage
      API.
  - name: Allocation
    description: >-
      Tag Rook namespaces, storage classes, and CephBlockPools to the consuming workload so
      that capacity and IO can be attributed back to the team that owns the data.
  - name: Optimization
    description: >-
      Right-size OSD count, choose appropriate replication vs erasure-coding, set per-pool
      quotas, and tier rarely accessed data to lower-cost storage classes; consolidate small
      Ceph clusters to amortize MON/MGR overhead.
  - name: Accountability
    description: >-
      Platform engineering owns the Rook/Ceph cluster; consuming teams own per-namespace and
      per-pool quotas. Treat any vendor-support contract as a normal SaaS line item under
      platform budget.
maintainers:
